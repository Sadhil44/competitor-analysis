# Competitor + crawl-target configuration.
#
# This file is the single source of truth for *which* competitors the system
# tracks and *where* to crawl for each one. Nothing about individual products,
# prices, SWOT content, or developments belongs here — those are discovered
# and written to Postgres by the scraping pipeline and agent. This file only
# ever changes when you add/remove a competitor or adjust crawl targets.
#
# Loaded by backend/app/core/config.py at startup and on each scheduled run.
#
# Real competitors for Gardens Alive. Tracked scope: each competitor's full
# product catalog (2026-08-17) — the scraping pipeline discovers products
# site-wide via each competitor's sitemap, not just the one category below.
# `catalog_urls` remains per competitor as a known-good seed page (guaranteed
# included regardless of sitemap discovery, and still individually crawled
# for its own product links + campaign banners) — originally the *only*
# scope, kept now because it's a real, human-verified entry point, not
# because scope is still limited to it. Burpee (burpee.com) is deliberately excluded —
# its perennials pages are behind DataDome bot-detection (HTTP 403 with a
# challenge page), which is an explicit signal the site doesn't want automated
# access. Circumventing that would cross from polite scraping into deliberately
# defeating a site's anti-bot controls, so it's not attempted here. If Burpee
# data is needed, it would have to come from a different source (a business/
# affiliate data feed, manual spot-checks), not scraping.
#
# Note: `gurneys` below is OUR OWN storefront, not a competitor — deliberately
# included here to reuse the same fetch/extract/store pipeline rather than
# build a parallel schema. Downstream code (agent tools, dashboard) needs to
# treat this one entry as "us," not "them." Tracked as "Gurney's" rather than
# narrowly "Gardens Alive": Gardens Alive no longer runs its own storefront
# (see notes below) and now operates as a sub-brand within Gurney's broader
# catalog — Gurney's is the actual real-world storefront/brand to track.

competitors:
  - slug: fast-growing-trees
    name: "Fast Growing Trees"
    website_url: "https://www.fast-growing-trees.com"
    active: true
    notes: >
      Real competitor. Verified perennials category page loads correctly via
      our fetcher (2026-07-25).
    crawl:
      # Cron expression (5-field, standard cron syntax) consumed by APScheduler.
      cadence_cron: "0 6 * * *"      # daily at 06:00
      rate_limit_seconds: 2           # minimum delay between requests to this domain
      catalog_urls:
        - "https://www.fast-growing-trees.com/collections/perennials"

  - slug: holland-bulb-farms
    name: "Holland Bulb Farms"
    website_url: "https://www.hollandbulbfarms.com"
    active: true
    notes: >
      Real competitor. Verified perennials category page loads correctly via
      our fetcher (2026-07-25).
    crawl:
      cadence_cron: "0 6 * * *"
      rate_limit_seconds: 2
      catalog_urls:
        - "https://www.hollandbulbfarms.com/spring-planting-bulbs/perennials"

  - slug: american-meadows
    name: "American Meadows"
    website_url: "https://www.americanmeadows.com"
    active: true
    notes: >
      Real competitor. Verified perennials category page loads correctly via
      our fetcher (2026-07-25) — required switching the fetcher's wait
      strategy from networkidle to domcontentloaded due to this site's
      persistent background network activity (chat widget, analytics).
      Switched catalog_url (2026-08-02) from /category/perennials — a
      curated, non-paginated landing page capped at 24 items — to
      /collections/perennial-plants, the real underlying paginated
      collection (confirmed via a pagination link found in the page HTML),
      to get real depth via our multi-page ingest.
    crawl:
      cadence_cron: "0 6 * * *"
      rate_limit_seconds: 2
      catalog_urls:
        - "https://www.americanmeadows.com/collections/perennial-plants"

  - slug: epic-gardening
    name: "Epic Gardening"
    website_url: "https://shop.epicgardening.com"
    active: true
    notes: >
      Real competitor, added 2026-08-24 for the raised-bed workbench demo
      (Wed Aug 26). Scope is deliberately narrow: catalog_urls points at the
      raised-garden-beds collection only, and crawl_demo_scope.py runs
      crawl_competitor(scoped=True) for this identity so ingestion stays
      within that collection instead of walking the full site sitemap (see
      app/scraping/ingest.py's scoped param).
    crawl:
      cadence_cron: "0 6 * * *"
      rate_limit_seconds: 2
      catalog_urls:
        - "https://shop.epicgardening.com/collections/raised-garden-beds"

  - slug: vego-garden
    name: "Vego Garden"
    website_url: "https://www.vegogarden.com"
    active: true
    notes: >
      Real competitor, added 2026-08-24 for the raised-bed workbench demo
      (Wed Aug 26). Same scoped-crawl treatment as epic-gardening above —
      catalog_urls is the garden-beds collection only.
    crawl:
      cadence_cron: "0 6 * * *"
      rate_limit_seconds: 2
      catalog_urls:
        - "https://www.vegogarden.com/collections/garden-beds"

  - slug: gardeners-supply
    name: "Gardener's Supply Company"
    website_url: "https://www.gardeners.com"
    active: true
    notes: >
      Added 2026-08-24 for the raised-bed workbench demo (Wed Aug 26) —
      this is OUR OWN brand (already is_own_brand=true via brand_num 53 in
      config/own_brands.yaml, matched by slug the same way `gurneys` below
      is dual-listed), but until now it only had internal-feed pricing, no
      scraped website data. Adding it here gets it the same scraped
      product/price coverage as any competitor, scoped to the raised-bed
      collection so it's directly comparable to epic-gardening/vego-garden
      above. Does not affect its existing internal-feed data (source=
      "internal_feed" vs. "scheduled_crawl" stay distinguishable on
      PriceObservation).
    crawl:
      cadence_cron: "0 6 * * *"
      rate_limit_seconds: 2
      catalog_urls:
        - "https://www.gardeners.com/collections/raised-garden-beds"

  - slug: spring-hill-nurseries
    name: "Spring Hill Nurseries"
    website_url: "https://www.springhillnursery.com"
    active: true
    notes: >
      Added 2026-08-26 — OUR OWN brand (already is_own_brand=true via
      brand_num 4 in config/own_brands.yaml, dual-listed the same way
      gardeners-supply is above), previously feed-only. Verified perennials
      category page loads correctly via our fetcher (2026-08-26).
    crawl:
      cadence_cron: "0 6 * * *"
      rate_limit_seconds: 2
      catalog_urls:
        - "https://springhillnursery.com/collections/best_selling_perennial_plants"

  - slug: brecks
    name: "Breck's"
    website_url: "https://www.brecks.com"
    active: true
    notes: >
      Added 2026-08-26 — OUR OWN brand (already is_own_brand=true via
      brand_num 7 in config/own_brands.yaml), previously feed-only. Verified
      spring-flowering-bulbs category page loads correctly via our fetcher
      (2026-08-26).
    crawl:
      cadence_cron: "0 6 * * *"
      rate_limit_seconds: 2
      catalog_urls:
        - "https://www.brecks.com/collections/spring_flowering_bulbs"

  - slug: k-van-bourgondien
    name: "K. van Bourgondien"
    website_url: "https://www.dutchbulbs.com"
    active: true
    notes: >
      Added 2026-08-26 — OUR OWN brand (already is_own_brand=true via
      brand_num 36 in config/own_brands.yaml), previously feed-only and
      whose domain that entry's own note flagged as "not independently
      re-verified" — now verified: dutchbulbs.com/collections/all loads
      correctly via our fetcher (2026-08-26).
    crawl:
      cadence_cron: "0 6 * * *"
      rate_limit_seconds: 2
      catalog_urls:
        - "https://www.dutchbulbs.com/collections/all"

  - slug: gurneys
    name: "Gurney's (parent brand of Gardens Alive — us)"
    website_url: "https://www.gurneys.com"
    active: true
    notes: >
      NOT a competitor — this is our own storefront. gardensalive.com's SSL
      certificate has expired (ERR_CERT_DATE_INVALID as of 2026-07-25) and
      the brand no longer runs independently; Gardens Alive now operates as
      a sub-brand within Gurney's broader catalog (gurneys.com), so Gurney's
      is tracked as the real "us" rather than a narrower Gardens-Alive-only
      slice. The tracked catalog_url is Gurney's general perennials/bulbs/
      flowers category — it mixes Gurney's-branded and Gardens-Alive-branded
      SKUs together (not cleanly separable). Switched to the canonical
      /collections/ URL (2026-08-02, found via the page's <link rel=
      canonical>) — confirmed via page 2 being nearly empty that this
      category's true catalog really is only ~30-34 products, not a
      truncation artifact like American Meadows was.
    crawl:
      cadence_cron: "0 6 * * *"
      rate_limit_seconds: 2
      catalog_urls:
        - "https://www.gurneys.com/collections/all-perennials-bulbs-and-flowers"
