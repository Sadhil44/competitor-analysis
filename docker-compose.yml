services:
  postgres:
    # pgvector/pgvector ships official Postgres images with the pgvector
    # extension pre-built, so we don't need a custom Dockerfile for the DB.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./config:/config:ro

  frontend:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npx next dev -H 0.0.0.0"
    env_file: .env
    environment:
      # Browser-side fetches (the ask-agent page) leave the Docker network
      # entirely, so they need the host-mapped port. 127.0.0.1, not
      # localhost: on this host, "localhost" resolves to ::1 first and
      # Docker Desktop's port mapping doesn't answer on it, so a browser
      # fetch to "localhost:8000" hangs/fails even though the port really
      # is published — 127.0.0.1 forces the IPv4 path that actually works.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      # Server Components run inside this container, so "localhost" would
      # mean the frontend container itself, not backend — use the compose
      # service name instead.
      INTERNAL_API_URL: http://backend:8000
      # Docker Desktop's Windows<->Linux filesystem bridge doesn't reliably
      # propagate inotify events for host-side edits, so Turbopack's file
      # watcher (and its persistent .next/dev cache) can silently keep
      # serving stale output after a save. Polling-based watching notices
      # the change instead of waiting for an event that may never arrive.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
