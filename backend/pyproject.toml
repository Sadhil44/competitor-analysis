[project]
name = "competitor-analysis-backend"
version = "0.1.0"
description = "Competitor analysis agent backend: API, scraping pipeline, and Claude Agent SDK orchestrator/subagents"
requires-python = ">=3.12,<3.14"
dependencies = [
    # API layer
    "fastapi[standard]>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Database (async Postgres + ORM + migrations + vector column support)
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    # Scraping
    "playwright>=1.49",
    # LLM-based structured extraction — via anthropic's native client.messages.parse(),
    # not a separate library (see app/scraping/extractor.py). Also used directly
    # by the web_search tool (app/agent/tools/__init__.py) for the server-side
    # web_search_20260209 tool, which LangChain/LangGraph don't wrap natively.
    "anthropic>=0.60",
    # Agent orchestration — LangGraph StateGraph replaces the earlier
    # claude-agent-sdk orchestrator (see app/agent/orchestrator.py) as the more
    # explicit, graph-based demonstration: routing is a plain conditional edge,
    # and each subagent's tool access is enforced by the graph, not just prompt.
    "langgraph>=0.6",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3.30",
    # Embeddings
    "voyageai>=0.3",
    # Scheduling
    "apscheduler>=3.11",
    # Config loading
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
